<mat-toolbar color="primary" class="app-toolbar">
  <a mat-icon-button routerLink="/dashboard" aria-label="Back to Dashboard">
    <mat-icon>arrow_back</mat-icon>
  </a>
  <span>Add Multiple Quizzes to Firebase</span>
  <span class="app-toolbar__spacer"></span>
  <a mat-button routerLink="/dashboard">
    <mat-icon>dashboard</mat-icon> Dashboard
  </a>
</mat-toolbar>

<div class="add-quizzes-container ml-scroll">
  <mat-card class="ml-card-surface add-quizzes-card">
    <mat-card-header>
      <mat-icon mat-card-avatar color="accent">post_add</mat-icon>
      <mat-card-title>Bulk Quiz Uploader (Firebase Firestore)</mat-card-title>
      <mat-card-subtitle>Paste or edit JSON below to add multiple quizzes into Firebase simultaneously using batch writes.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="add-quizzes-content">
      <div class="actions-bar">
        <button mat-stroked-button (click)="loadSampleTemplate()">
          <mat-icon>auto_awesome</mat-icon> Load Sample Template
        </button>
        <button mat-stroked-button (click)="formatJson()">
          <mat-icon>code</mat-icon> Format JSON
        </button>
      </div>

      <mat-form-field appearance="outline" class="full-width json-field">
        <mat-label>Quizzes JSON Data</mat-label>
        <textarea
          matInput
          [(ngModel)]="jsonInput"
          rows="18"
          placeholder="Paste JSON array of QuizDefinition objects here..."
        ></textarea>
      </mat-form-field>

      @if (jsonError()) {
        <div class="error-banner">
          <mat-icon>error_outline</mat-icon>
          <span>{{ jsonError() }}</span>
        </div>
      }
    </mat-card-content>

    <mat-card-actions align="end" class="add-quizzes-actions">
      <a mat-button routerLink="/dashboard">Cancel</a>
      <button
        mat-raised-button
        color="primary"
        [disabled]="isUploading()"
        (click)="uploadMultipleQuizzes()"
      >
        <mat-icon>cloud_upload</mat-icon>
        {{ isUploading() ? 'Uploading to Firebase...' : 'Upload Quizzes to Firebase' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
